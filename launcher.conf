# debian-bootstrap-launcher policy configuration

# Permanent users created by the launcher are added to these groups when the
# groups exist on the current system.
PERMANENT_USER_GROUPS="sudo,audio,video,plugdev,netdev"

# Home encryption is the core purpose of this launcher.
REQUIRE_HOME_ENCRYPTION=true

# Existing permanent users may be selected only when their home directory is
# missing or empty. Populated, unencrypted homes remain unsupported.
ALLOW_EXISTING_USERS=false

# The launcher creates permanent home directories with this mode.
HOME_MODE="0700"

# The temporary administrative account is never removed automatically.
REMOVE_TEMPORARY_ADMIN=false
